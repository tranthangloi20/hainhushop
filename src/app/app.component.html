<header class="sticky top-0 z-50 border-b border-blue-100/80 bg-white/95 backdrop-blur-xl">
  <div class="mx-auto flex min-h-20 max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a routerLink="/" (click)="closeMenu()" class="min-w-0" aria-label="Hải Như Shop - Trang chủ">
      <app-pharmacy-logo />
    </a>

    <nav class="hidden items-center gap-1 text-sm font-bold text-slate-600 md:flex">
      <a routerLink="/" class="rounded-xl px-3 py-2 transition hover:bg-blue-50 hover:text-blue-700">Sản phẩm</a>
      <a routerLink="/policy" class="rounded-xl px-3 py-2 transition hover:bg-blue-50 hover:text-blue-700">Chính sách</a>
      <a routerLink="/login" class="rounded-xl bg-blue-700 px-4 py-2.5 text-white shadow-md shadow-blue-200 transition hover:bg-blue-800">Đăng nhập</a>
    </nav>

    <button type="button" class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-blue-100 bg-white text-blue-800 shadow-sm md:hidden" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Mở menu">
      <span class="text-2xl leading-none">{{ menuOpen ? '×' : '☰' }}</span>
    </button>
  </div>

  <div *ngIf="menuOpen" class="border-t border-blue-100 bg-white px-4 pb-4 md:hidden">
    <nav class="mx-auto grid max-w-7xl gap-2 pt-3 text-sm font-bold">
      <a routerLink="/" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-slate-700 hover:bg-blue-50 hover:text-blue-700">Sản phẩm</a>
      <a routerLink="/policy" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-slate-700 hover:bg-blue-50 hover:text-blue-700">Chính sách bán hàng</a>
      <a routerLink="/login" (click)="closeMenu()" class="rounded-xl bg-blue-700 px-4 py-3 text-center text-white">Đăng nhập</a>
    </nav>
  </div>
</header>

<main><router-outlet /></main>

<footer class="border-t border-blue-100 bg-gradient-to-b from-white to-blue-50">
  <div class="mx-auto grid max-w-7xl gap-8 px-4 py-12 sm:px-6 md:grid-cols-3">
    <div>
      <app-pharmacy-logo />
      <p class="mt-4 max-w-sm text-sm leading-6 text-slate-500">
        <span class="font-bold text-amber-500">Mua hàng tiện lợi,</span>
        <span class="font-bold text-white bg-blue-950 px-1"> tư vấn tận tâm.</span>
      </p>
    </div>

    <div>
      <div class="font-black text-blue-950">Địa chỉ</div>
      <p class="mt-2 text-sm leading-6 text-slate-500">{{ config.address }}</p>
    </div>

    <div>
      <div class="font-black text-blue-950">Liên hệ</div>
      <div class="mt-2 grid gap-2 text-sm leading-6 text-slate-500">
        <a [href]="'tel:' + config.shopPhone" class="font-semibold text-blue-700 hover:text-blue-900">Điện thoại shop: {{ config.shopPhone }}</a>
        <a [href]="'https://zalo.me/' + config.zaloPhone" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-700 hover:text-blue-900">Zalo: {{ config.zaloPhone }}</a>
        <a [href]="'tel:' + config.pharmacistPhone" class="font-semibold text-blue-700 hover:text-blue-900">Dược sĩ: {{ config.pharmacistPhone }}</a>
      </div>
    </div>
  </div>
  <div class="border-t border-blue-100 py-4 text-center text-xs text-slate-400">© 2026 Hải Như Shop · All rights reserved.</div>
</footer>
