name: Keep Supabase Alive

on:
  schedule:
    # Every day at 00:00 UTC (07:00 Vietnam time)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "https://kykplvmvjcamxpxdkmxy.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
